name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or retry (for example v1.6.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  linux:
    needs: validate
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
  windows:
    needs: validate
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
  macos:
    needs: validate
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
  updater-tests:
    needs: validate
    uses: ./.github/workflows/test-updater.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
  publish:
    needs: [validate, linux, windows, macos, updater-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: codex-prism-*
          path: release-artifacts
      - name: Assemble and upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRISM_UPDATE_PUBLIC_KEY: ${{ secrets.PRISM_UPDATE_PUBLIC_KEY }}
        run: node scripts/github-release.mjs "$RELEASE_TAG" release-artifacts dist/github-release
